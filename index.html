<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050b14;
            color: #00f0ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .arc-reactor {
            width: 200px;
            height: 200px;
            border: 4px solid #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px #00f0ff, inset 0 0 30px #00f0ff;
            animation: pulse 2s infinite alternate;
            margin: 0 auto 30px auto;
        }

        .core {
            width: 80px;
            height: 80px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 50px #fff;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00f0ff;
        }

        p {
            font-size: 1rem;
            color: #8bdfed;
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #00f0ff;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 25px #00f0ff;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #00f0ff; }
            100% { transform: scale(1.05); box-shadow: 0 0 40px #00f0ff; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="arc-reactor">
            <div class="core"></div>
        </div>
        <h1>J.A.R.V.I.S.</h1>
        <p id="status">Clique no botão para ativar</p>
        <button id="btn">Iniciar Sistema</button>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const statusText = document.getElementById('status');

        // Configuração da Fala (Texto para Voz)
        function falar(texto) {
            const fala = new SpeechSynthesisUtterance(texto);
            fala.lang = 'pt-BR';
            fala.rate = 1.0;
            window.speechSynthesis.speak(fala);
        }

        // Reconhecimento de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;

            btn.addEventListener('click', () => {
                falar("Sistema online. Como posso ajudar, senhor?");
                statusText.innerText = "Ouvindo...";
                recognition.start();
            });

            recognition.onresult = (event) => {
                const comando = event.results[0][0].transcript.toLowerCase();
                statusText.innerText = "Comando: " + comando;

                if (comando.includes('que horas são') || comando.includes('horas')) {
                    const agora = new Date();
                    const horario = `${agora.getHours()} e ${agora.getMinutes()} minutos`;
                    falar(`Agora são ${horario}`);
                } 
                else if (comando.includes('abrir o google')) {
                    falar("Abrindo o Google, senhor.");
                    window.open('https://google.com', '_blank');
                } 
                else {
                    falar("Desculpe, não reconheci esse comando.");
                }
            };

            recognition.onend = () => {
                statusText.innerText = "Clique para falar novamente";
            };
        } else {
            statusText.innerText = "Navegador não suporta reconhecimento de voz.";
        }
    </script>
</body>
</html>
