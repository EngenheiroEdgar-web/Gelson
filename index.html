<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Inteligence Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050b14;
            color: #00f0ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            max-width: 600px;
            padding: 20px;
        }

        .arc-reactor {
            width: 200px;
            height: 200px;
            border: 4px solid #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px #00f0ff, inset 0 0 30px #00f0ff;
            margin: 0 auto 30px auto;
        }

        /* Animação quando a IA está processando conhecimento */
        .thinking {
            animation: spinPulse 1.2s infinite linear;
            border-color: #00ffaa !important;
            box-shadow: 0 0 30px #00ffaa, inset 0 0 30px #00ffaa !important;
        }

        .core {
            width: 80px;
            height: 80px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 50px #fff;
            transition: 0.5s;
        }

        .thinking .core {
            background-color: #00ffaa !important;
            box-shadow: 0 0 50px #00ffaa !important;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00f0ff;
        }

        p {
            font-size: 1rem;
            color: #8bdfed;
            margin-bottom: 20px;
            line-height: 1.4;
            min-height: 40px;
        }

        button {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #00f0ff;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 25px #00f0ff;
        }

        @keyframes spinPulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="arc-reactor" id="reactor">
            <div class="core"></div>
        </div>
        <h1>J.A.R.V.I.S.</h1>
        <p id="status">Clique abaixo para inicializar a IA.</p>
        <button id="btn">Iniciar Sistema</button>
    </div>

    <!-- Importação do SDK da IA do Google de forma direta -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run";

        // IMPORTANTE: Insira sua chave de acesso gerada no Google AI Studio aqui dentro das aspas
        const apiKey = "SUA_API_KEY_AQUI";

        const ai = new GoogleGenAI({ apiKey: apiKey });

        const btn = document.getElementById('btn');
        const statusText = document.getElementById('status');
        const reactor = document.getElementById('reactor');

        // Mecanismo de síntese de voz nativa
        function falar(texto) {
            const fala = new SpeechSynthesisUtterance(texto);
            fala.lang = 'pt-BR';
            fala.rate = 1.05; 
            window.speechSynthesis.speak(fala);
        }

        // Conexão e prompt com o modelo inteligente Gemini 2.5
        async function processarIA(perguntaDoUsuario) {
            reactor.classList.add('thinking');
            statusText.innerText = "Buscando nos bancos de dados globais...";

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: preguntaDoUsuario,
                    config: {
                        // Diretrizes fundamentais para manter a personalidade do JARVIS
                        systemInstruction: "Você é o J.A.R.V.I.S., a inteligência artificial ultra avançada do Engenheiro Edgar. Responda-o sempre com respeito, chamando-o de Engenheiro Edgar ou Senhor. Suas respostas devem conter raciocínio lógico impecável, sabedoria profunda no nível do Google, mas ser extremamente diretas, sem textos longos, pois suas respostas serão lidas por voz artificial.",
                    }
                });

                const respostaTexto = response.text;
                
                reactor.classList.remove('thinking');
                statusText.innerText = `J.A.R.V.I.S: ${respostaTexto}`;
                falar(respostaTexto);

            } catch (erro) {
                reactor.classList.remove('thinking');
                statusText.innerText = "Falha no link de dados neural.";
                falar("Houve uma queda de conexão com a rede principal, Engenheiro Edgar.");
                console.error(erro);
            }
        }

        // Sistema de reconhecimento de voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;

            btn.addEventListener('click', () => {
                falar("Seja bem vindo Engenheiro Edgar. Sistema online. Como posso ajudar?");
                statusText.innerText = "Escutando diretrizes...";
                
                setTimeout(() => {
                    recognition.start();
                }, 4000); 
            });

            recognition.onresult = (event) => {
                const comando = event.results.transcript.toLowerCase();
                statusText.innerText = `Você disse: "${comando}"`;

                // Comandos nativos em cache local rápido
                if (comando.includes('que horas são') || comando.includes('horas')) {
                    const agora = new Date();
                    falar(`Agora são ${agora.getHours()} horas e ${agora.getMinutes()} minutos, Senhor.`);
                } 
                else if (comando.includes('abrir o google')) {
                    falar("Abrindo terminal de busca Google, Engenheiro Edgar.");
                    window.open('https://google.com', '_blank');
                } 
                // Envia todo o restante para processamento na IA
                else {
                    processarIA(comando);
                }
            };

            recognition.onend = () => {
                if(!reactor.classList.contains('thinking')) {
                    statusText.innerText = "Pronto para novas ordens...";
                }
            };
        } else {
            statusText.innerText = "Hardware de áudio ou navegador não suportado.";
        }
    </script>
</body>
</html>
